[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "csanddemon-ocrmdoc_jd412"
version = "0.1.0"
description = "解析时间标记，排列OCR 文档理解工程师·知识库的时效性维护的发生顺序，标出间隔异常与逆序事件"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "csanddemon" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://csanddemon.github.io"
Repository = "https://github.com/csanddemon/ocrmdoc_jd412"
Issues = "https://github.com/csanddemon/ocrmdoc_jd412/issues"

[project.scripts]
ocrmdoc_jd412 = "ocrmdoc_jd412:main"

[tool.setuptools]
py-modules = ["ocrmdoc_jd412"]
